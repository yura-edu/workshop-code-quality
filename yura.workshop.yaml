# yura.workshop.yaml — declarative grader config
# Spec: docs/grader-workers-spec.md §6
# Generated from prisma/seeds/workshop-templates.seed.ts

schema_version: "1.0"
workshop:
  id: code-quality
  title: "Code Quality"
  type: code_quality
  language: typescript
  passing_threshold: 70
  base_branch: main
submission:
  source: workshop_link
  required_inputs:
    - type: github_repo_url
      label: "URL del repositorio"
      required: true
evaluation_profile:
  - metric_id: cyclomatic_complexity
    weight: 35
    threshold: 15
    config:
      tool: eslint-complexity
      max_per_function: 15
      aggregation: avg
      include_paths:
        - src/
      exclude_paths:
        - tests/
        - "**/__init__.py"
        - "**/*.test.ts"
        - "**/*.spec.ts"
      timeout_seconds: 120
  - metric_id: code_duplication
    weight: 35
    threshold: 0.05
    config:
      tool: jscpd
      min_tokens: 50
      min_lines: 5
      max_duplication_percent: 5
      ignore_paths:
        - dist/
        - build/
        - "**/__pycache__/**"
  - metric_id: lint_violations
    weight: 30
    threshold: 0
    config:
      tool: eslint
      severity_levels:
        - error
        - warning
      fail_on: error
      max_violations: 0
